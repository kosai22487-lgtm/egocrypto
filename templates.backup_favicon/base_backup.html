<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egocrypto - Trading Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0e14] text-gray-100 min-h-screen font-sans antialiased">

    <!-- Main Content Container -->
    <div class="max-w-md mx-auto min-h-screen bg-[#0b0e14] relative shadow-2xl overflow-x-hidden">

        <!-- Dynamic Block Content -->
        <main class="p-4">
            {% block content %}
            {% endblock %}
        </main>

    </div>

</body>
</html>
