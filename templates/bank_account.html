<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Bank Account - Egocrypto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0e14] text-white min-h-screen flex flex-col">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-4 border-b border-gray-800">
        <button onclick="history.back()" class="text-gray-400 hover:text-white text-xl">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2 class="text-lg font-bold">Add Bank Account</h2>
        <div class="w-8"></div>
    </div>

    <!-- Bank Icon -->
    <div class="flex justify-center py-6">
        <div class="w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-3xl">
            <i class="fa-solid fa-building-columns"></i>
        </div>
    </div>

    <!-- Form Content -->
    <div class="flex-1 px-4 py-4">
        <p class="text-sm text-gray-400 mb-6 text-center">Link your bank account securely</p>

        <div class="space-y-5">
            <!-- Account Holder Name -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Account Holder Name</label>
                <input type="text" id="account-holder" placeholder="Full name" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-5 py-4 text-lg text-white focus:outline-none focus:border-blue-500">
            </div>

            <!-- Bank Name -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Bank Name</label>
                <input type="text" id="bank-name" placeholder="e.g. Chase, Bank of America" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-5 py-4 text-lg text-white focus:outline-none focus:border-blue-500">
            </div>

            <!-- Account Number -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Account Number</label>
                <input type="text" id="account-number" placeholder="Account number" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-5 py-4 text-lg text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <!-- Routing Number -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Routing Number</label>
                <input type="text" id="routing-number" placeholder="9-digit routing number" maxlength="9" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-5 py-4 text-lg text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <!-- Account Type -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Account Type</label>
                <select id="account-type" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-5 py-4 text-lg text-white focus:outline-none focus:border-blue-500">
                    <option value="checking">Checking</option>
                    <option value="savings">Savings</option>
                </select>
            </div>

            <!-- Billing Address -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Billing Address</label>
                <input type="text" id="billing-address" placeholder="Street address" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-5 py-4 text-lg text-white focus:outline-none focus:border-blue-500">
            </div>

            <!-- Terms -->
            <p class="text-xs text-gray-500">By linking your bank account, you agree to our terms and authorize Egocrypto to verify your account.</p>

            <!-- Submit -->
            <button onclick="submitBankAccount()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl text-lg transition">
                LINK BANK ACCOUNT
            </button>
        </div>
    </div>

    <script>
    function submitBankAccount() {
        const holder = document.getElementById('account-holder').value.trim();
        const bankName = document.getElementById('bank-name').value.trim();
        const accountNumber = document.getElementById('account-number').value.trim();
        const routingNumber = document.getElementById('routing-number').value.trim();
        const accountType = document.getElementById('account-type').value;
        const billingAddress = document.getElementById('billing-address').value.trim();
        
        if (!holder || !bankName || !accountNumber || !routingNumber || !billingAddress) {
            alert('Please fill in all fields.');
            return;
        }
        
        fetch('/api/payment/bank-account', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                account_holder: holder,
                bank_name: bankName,
                account_number: accountNumber,
                routing_number: routingNumber,
                account_type: accountType,
                billing_address: billingAddress
            })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                alert('Bank account linked successfully!');
                history.back();
            } else {
                alert(data.message || 'Failed to link bank account');
            }
        });
    }
    </script>
</body>
</html>
