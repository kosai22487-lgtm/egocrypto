{% extends "base.html" %}
{% block content %}
<div class="space-y-4 pb-20 text-gray-100">
    <div class="flex items-center justify-between">
        <a href="/" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-lg"></i></a>
        <h2 class="text-lg font-bold text-white">Markets</h2>
        <div class="w-6"></div>
    </div>
    
    <!-- Tab Navigation -->
    <div class="flex space-x-2 overflow-x-auto pb-2" id="tabContainer">
        <button onclick="switchMarketTab('all', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-teal-500 text-gray-950 whitespace-nowrap transition cursor-pointer">All</button>
        <button onclick="switchMarketTab('favorite', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer">Favorite</button>
        <button onclick="switchMarketTab('hot', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer">Hot</button>
        <button onclick="switchMarketTab('alpha', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer">Alpha</button>
        <button onclick="switchMarketTab('new', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer">New</button>
        <button onclick="switchMarketTab('gainers', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer">Gainers</button>
        <button onclick="switchMarketTab('losers', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer">Losers</button>
        <button onclick="switchMarketTab('future', this)" class="market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer">Future</button>
    </div>

    <!-- Coin List Container -->
    <div id="coinListContainer" class="space-y-1 max-h-[70vh] overflow-y-auto">
        <p class="text-center text-gray-400 py-6">Loading coins...</p>
    </div>
</div>

<script>
    let allCoins = [];
    let currentTab = 'all';

    async function fetchMarketData() {
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=24h,7d');
            allCoins = await res.json();
            renderCoins();
        } catch (err) {
            document.getElementById('coinListContainer').innerHTML = '<p class="text-center text-red-400 py-6">Failed to load data.</p>';
        }
    }

    function renderCoins() {
        let sorted = [...allCoins];
        if (currentTab === 'gainers') sorted.sort((a, b) => (b.price_change_percentage_24h || 0) - (a.price_change_percentage_24h || 0));
        else if (currentTab === 'losers') sorted.sort((a, b) => (a.price_change_percentage_24h || 0) - (b.price_change_percentage_24h || 0));
        else if (currentTab === 'volume') sorted.sort((a, b) => (b.total_volume || 0) - (a.total_volume || 0));
        else if (currentTab === 'alpha') sorted.sort((a, b) => (b.price_change_percentage_7d_in_currency || 0) - (a.price_change_percentage_7d_in_currency || 0));
        else if (currentTab === 'new') sorted.sort((a, b) => (b.id || '').localeCompare(a.id || ''));

        let html = '';
        sorted.forEach(coin => {
            const change = (currentTab === 'alpha') ? coin.price_change_percentage_7d_in_currency : coin.price_change_percentage_24h;
            const changeClass = change >= 0 ? 'text-emerald-400' : 'text-rose-400';
            const changeSign = change >= 0 ? '+' : '';
            const changeVal = change != null ? change.toFixed(2) : 'N/A';
            const price = coin.current_price ? `$${coin.current_price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 6 })}` : 'N/A';
            
            html += `<div onclick="goToTrading('${coin.id}', '${coin.symbol.toUpperCase()}USDT', '${coin.name}')" class="flex items-center justify-between bg-[#12161f] border border-gray-800/80 px-4 py-3 rounded-xl hover:bg-gray-800/50 transition cursor-pointer">
                <div class="flex items-center space-x-3">
                    <img src="${coin.image}" alt="${coin.name}" class="w-8 h-8 rounded-full">
                    <div>
                        <div class="text-white font-bold text-sm">${coin.name}</div>
                        <div class="text-xs text-gray-400 uppercase">${coin.symbol}</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-white font-bold text-sm">${price}</div>
                    <div class="text-xs font-semibold ${changeClass}">${changeSign}${changeVal}%</div>
                </div>
            </div>`;
        });
        document.getElementById('coinListContainer').innerHTML = html || '<p class="text-center text-gray-400 py-6">No coins found.</p>';
    }

    function switchMarketTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.market-tab').forEach(b => {
            b.className = 'market-tab px-4 py-2 rounded-xl text-xs font-bold bg-[#0b0e14] border border-gray-700 text-gray-300 whitespace-nowrap transition cursor-pointer';
        });
        btn.className = 'market-tab px-4 py-2 rounded-xl text-xs font-bold bg-teal-500 text-gray-950 whitespace-nowrap transition cursor-pointer';
        renderCoins();
    }

    function goToTrading(coinId, symbol, name) {
        window.location.href = `/trading?coin=${coinId}&symbol=${symbol}&name=${encodeURIComponent(name)}`;
    }

    fetchMarketData();
</script>
{% endblock %}
