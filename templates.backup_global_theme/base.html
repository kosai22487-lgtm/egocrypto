<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egocrypto - Trading Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/custom.css">
</head>
<body class="bg-[#0b0e14] text-gray-100 min-h-screen font-sans antialiased">

    <!-- Main Content Container -->
    <div class="max-w-md mx-auto min-h-screen bg-[#0b0e14] relative shadow-2xl overflow-x-hidden">

        <!-- Dynamic Block Content -->
        <main class="p-4">
            {% block content %}
            {% endblock %}
        </main>

    </div>

<script src="/static/customer_service.js"></script>

<script>
function openCustomerService(event) {
    if (event) event.preventDefault();
    fetch('/api/get-settings')
        .then(r => r.json())
        .then(data => {
            const telegram = data.telegram_link || '';
            const whatsapp = data.whatsapp_number || '';
            if (telegram) {
                window.open(telegram, '_blank');
            } else if (whatsapp) {
                // WhatsApp နံပါတ်ကို သန့်စင်ပြီး wa.me link ဖွင့်မယ်
                const cleaned = whatsapp.replace(/[^0-9]/g, '');
                if (cleaned) {
                    window.open('https://wa.me/' + cleaned, '_blank');
                } else {
                    alert('Support contact not configured.');
                }
            } else {
                alert('Support contact not configured.');
            }
        })
        .catch(err => {
            console.error(err);
            alert('Could not load support settings.');
        });
}
</script>

<script src="/static/custom.js"></script>
</body>
</html>
