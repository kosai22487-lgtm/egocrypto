<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-teal-400">Admin Control Panel</h1>
            <p class="text-xs text-gray-400">Enter secure credentials to manage platform</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Admin Username</label>
                <input type="text" name="username" required class="w-full bg-gray-950 border border-gray-700 px-3 py-2 rounded-xl text-sm text-white focus:outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Admin Password</label>
                <input type="password" name="password" required class="w-full bg-gray-950 border border-gray-700 px-3 py-2 rounded-xl text-sm text-white focus:outline-none focus:border-teal-500">
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-gray-950 font-bold py-2.5 rounded-xl transition text-sm cursor-pointer">
                Access Panel
            </button>
        </form>

        <div class="text-center">
            <a href="/login" class="text-xs text-gray-400 hover:text-gray-200">Back to User Login</a>
        </div>
    </div>
</body>
</html>
